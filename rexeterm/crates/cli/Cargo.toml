[package]
name = "rexeterm-cli"
version = "0.2.13"
edition = "2021"
[features]
default = ["daemon", "local"]
daemon = ["ipc-client", "dep:rexeterm-daemon", "dep:rexeterm-application"]
local = ["daemon", "rexeterm-daemon/local"]
stdio = ["dep:rexeterm-adapter-common"]
admin = ["dep:unicode-width", "dep:remote_executor_protocol"]
ipc-client = ["dep:futures-util", "dep:rexeterm-cli-host", "dep:rand", "dep:tempfile"]
# Compatibility feature name; the CLI uses native IPC, never HTTP.
http-client = ["ipc-client"]
[[bin]]
name = "rexeterm"
path = "src/main.rs"
required-features = ["daemon"]
[dependencies]
rexeterm-daemon = {path="../daemon",optional=true}
rexeterm-application = {path="../application",optional=true}
rexeterm-cli-host = {path="../cli-host",optional=true}
remote_executor_protocol = {path="../../../rexed/crates/protocol",optional=true}
rexeterm-adapter-common = { path = "../adapter-common",optional=true }
rexeterm-appcore = { path = "../appcore" }
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std", "io-util", "net", "fs", "time", "signal"] }
unicode-width = { version = "0.2", optional = true }
rand = {version="0.9",optional=true}
tempfile = {version="3",optional=true}
futures-util = {version="0.3",optional=true}
fontdue = { version = "0.9", features = ["std"] }
png = "0.18"
avt = "0.20"
