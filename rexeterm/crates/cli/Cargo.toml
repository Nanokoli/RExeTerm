[package]
name = "rexeterm-cli"
version = "0.2.14"
edition = "2021"
default-run = "rexeterm"
[features]
default = ["daemon", "local"]
daemon = ["ipc-client", "dep:rexeterm-daemon", "dep:rexeterm-application", "dep:url", "dep:avt", "dep:fontdue", "dep:png"]
local = ["daemon", "rexeterm-daemon/local"]
stdio = ["dep:rexeterm-adapter-common"]
admin = ["dep:unicode-width", "dep:remote_executor_protocol"]
ipc-client = ["dep:futures-util", "dep:rexeterm-cli-host", "dep:rand", "dep:tempfile", "dep:base64"]
# Compatibility feature name; the CLI uses native IPC, never HTTP.
http-client = ["ipc-client"]
[[bin]]
name = "rexeterm"
path = "src/main.rs"
required-features = ["daemon"]
[[bin]]
name = "rexeterm-vscode-backend"
path = "src/vscode.rs"
required-features = ["daemon"]
[dependencies]
rexeterm-daemon = {path="../daemon",optional=true}
rexeterm-application = {path="../application",optional=true}
rexeterm-cli-host = {path="../cli-host",optional=true}
remote_executor_protocol = {path="../../../rexed/crates/protocol",optional=true}
rexeterm-adapter-common = { path = "../adapter-common",optional=true }
rexeterm-appcore = { path = "../appcore" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std", "io-util", "net", "fs", "time", "signal"] }
unicode-width = { version = "0.2", optional = true }
rand = {version="0.9",optional=true}
tempfile = {version="3",optional=true}
futures-util = {version="0.3",optional=true}
url = {version="2",optional=true}
fontdue = { version = "0.9", features = ["std"], optional = true }
png = { version = "0.18", optional = true }
avt = { version = "0.20", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
