name: package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.program }}-${{ matrix.id }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - program: rexed
            id: x64
            package: remote_executor
            bin: rexed
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - program: rexed
            id: x64_musl
            package: remote_executor
            bin: rexed
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - program: rexed
            id: i686_musl
            package: remote_executor
            bin: rexed
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - program: rexed
            id: arm64
            package: remote_executor
            bin: rexed
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - program: rexed
            id: arm64_musl
            package: remote_executor
            bin: rexed
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - program: rexed
            id: armv7_musl
            package: remote_executor
            bin: rexed
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            cross: true
          - program: rexed
            id: arm64_termux
            package: remote_executor
            bin: rexed
            target: aarch64-linux-android
            os: ubuntu-latest
            cross: false
          - program: rexed
            id: x64_msvc
            package: remote_executor
            bin: rexed
            target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - program: rexeterm-cli
            id: x64
            package: rexeterm-cli
            bin: rexeterm
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - program: rexeterm-cli
            id: x64_musl
            package: rexeterm-cli
            bin: rexeterm
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - program: rexeterm-cli
            id: arm64
            package: rexeterm-cli
            bin: rexeterm
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - program: rexeterm-cli
            id: arm64_musl
            package: rexeterm-cli
            bin: rexeterm
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - program: rexeterm-cli
            id: x64_msvc
            package: rexeterm-cli
            bin: rexeterm
            target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Configure Android linker
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [[ -z "$ndk" ]]; then
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$linker" >> "$GITHUB_ENV"

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p ${{ matrix.package }} --bin ${{ matrix.bin }} --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p ${{ matrix.package }} --bin ${{ matrix.bin }} --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ matrix.program }}-${{ matrix.id }}"
          if [ "${{ matrix.program }}" = rexed ]; then agents=rexed/AGENTS.md; else agents=rexeterm/AGENTS.md; fi
          mkdir -p "dist/${pkg}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${pkg}/${{ matrix.program }}"
          cp "$agents" "dist/${pkg}/AGENTS.md"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "${{ matrix.program }}-${{ matrix.id }}"
          $agents = if ("${{ matrix.program }}" -eq 'rexed') { 'rexed/AGENTS.md' } else { 'rexeterm/AGENTS.md' }
          New-Item -ItemType Directory -Force "dist/$pkg" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" "dist/$pkg/${{ matrix.program }}.exe"
          Copy-Item $agents "dist/$pkg/AGENTS.md"
          Compress-Archive -Path "dist/$pkg/*" -DestinationPath "dist/$pkg.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.program }}-${{ matrix.id }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pkg="${{ matrix.program }}-${{ matrix.id }}"
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          fi
          gh release upload "${GITHUB_REF_NAME}" "dist/${pkg}".* --clobber
