[package]
name = "remote_executor_data"
version = "0.2.13"
edition = "2021"
description = "Link-independent stream forwarding data protocol"
[dependencies]
sha2 = "0.10"
tempfile = "3"
remote_executor_protocol = { path = "../protocol" }
remote_executor_transport = { path = "../transport" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "fs", "rt"] }
