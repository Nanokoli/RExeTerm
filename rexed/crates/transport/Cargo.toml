[package]
name = "remote_executor_transport"
version = "0.2.13"
edition = "2021"
description = "Opaque RE frames over WebSocket, TCP and pluggable byte streams"

[features]
default = []
kcp = ["dep:tokio_kcp"]

[dependencies]
tokio_kcp = { version = "0.9.8", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "net", "sync", "rt", "time"] }
tokio-tungstenite = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
