[package]
name = "rexeterm-desktop"
version = "0.2.13"
edition = "2021"
build = "build.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[[bin]]
name = "rexeterm"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
rexeterm-app = { path = "../backend" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", optional = true, features = ["devtools", "custom-protocol"] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
