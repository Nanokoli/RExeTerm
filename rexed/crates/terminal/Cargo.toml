[package]
name = "remote_executor_terminal"
version = "0.2.13"
edition = "2021"
description = "RemoteExecutor native PTY sessions, output and process lifecycle"

[dependencies]
anyhow = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
