[package]
name = "rexeterm-http-adapt"
version = "0.2.13"
edition = "2021"
[dependencies]
rexeterm-application = { path = "../application" }
rexeterm-appcore = { path = "../appcore" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
sha2 = "0.10"
tempfile = "3"
async-stream = "0.3"
